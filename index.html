<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muscular Tissues I - Universal Cross-Platform Game</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <!-- Header & Game Controls -->
    <header class="game-header">
      <div class="title-area">
        <h1>💪 Muscular Tissues I</h1>
        <p class="subtitle">Universal Cross-Platform Drag & Drop Game</p>
      </div>
      <div class="stats-bar">
        <div class="stat-box">⏱️ <span id="timer-display">02:00</span></div>
        <div class="stat-box">⭐ Score: <span id="score-display">0</span></div>
        <div class="stat-box">🔥 Combo: <span id="combo-display">x0</span></div>
      </div>
    </header>

    <!-- Level Selector Tabs -->
    <nav class="level-nav">
      <button class="level-btn active" data-level="1">Level 1: Organization</button>
      <button class="level-btn" data-level="2">Level 2: Muscle Types</button>
      <button class="level-btn" data-level="3">Level 3: Fibers & Pathology</button>
    </nav>

    <!-- Instruction -->
    <div class="instruction-box">
      <p id="instruction-text">📌 Drag each card from the pool and drop it into its correct category below.</p>
    </div>

    <!-- Main Game Workspace -->
    <main class="game-workspace">
      <!-- Card Pool Zone -->
      <section class="card-pool-container">
        <div class="pool-header">
          <h3>📦 Item Pool</h3>
          <button id="shuffle-btn" class="btn btn-warning btn-sm">🔀 Shuffle Pool</button>
        </div>
        <div class="card-pool" id="card-pool">
          <!-- Cards injected dynamically via JavaScript -->
        </div>
      </section>

      <!-- Drop Categories Zone -->
      <section class="categories-container" id="categories-container">
        <!-- Category Drop Zones injected dynamically via JavaScript -->
      </section>
    </main>

    <!-- Action Buttons -->
    <footer class="game-footer">
      <button id="submit-btn" class="btn btn-primary">✔ Submit Answers</button>
      <button id="reset-btn" class="btn btn-secondary">🔄 Reset / Shuffle</button>
    </footer>
  </div>

  <!-- Result & Detailed Explanation Modal -->
  <div id="result-modal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title">Game Summary</h2>
        <span class="close-modal">&times;</span>
      </div>
      <div class="modal-body">
        <div class="score-summary">
          <div class="stars-display" id="stars-display">⭐⭐⭐</div>
          <p class="final-score" id="final-score-text">Your Score: 0 / 0</p>
          <p class="time-used" id="time-used-text">Time Remaining: 00:00</p>
        </div>
        
        <hr class="divider">
        
        <h3>📖 Detailed Explanations & Lecture Review</h3>
        <div class="explanation-list" id="explanation-list">
          <!-- Item feedback injected here -->
        </div>
      </div>
      <div class="modal-footer">
        <button id="next-level-btn" class="btn btn-primary">Next Level ➔</button>
        <button id="close-modal-btn" class="btn btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
